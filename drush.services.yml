services:
  os2forms_fordelingskomponent.sftp.ls:
    class: Drupal\os2forms_fordelingskomponent\Drush\Commands\SftpLsCommand
    arguments: &abstract_command_arguments
      - '@Drupal\os2forms_fordelingskomponent\Helper\FordelingskomponentHelper'
      - '@Drupal\os2forms_fordelingskomponent\Settings'
    tags:
      - { name: console.command }

  os2forms_fordelingskomponent.sftp.put:
    class: Drupal\os2forms_fordelingskomponent\Drush\Commands\SftpPutCommand
    arguments: *abstract_command_arguments
    tags:
      - { name: console.command }

  os2forms_fordelingskomponent.sftp.get:
    class: Drupal\os2forms_fordelingskomponent\Drush\Commands\SftpGetCommand
    arguments: *abstract_command_arguments
    tags:
      - { name: console.command }

  os2forms_fordelingskomponent.fordelingsmodtager.list:
    class: Drupal\os2forms_fordelingskomponent\Drush\Commands\FordelingsmodtagerListCommand
    arguments: *abstract_command_arguments
    tags:
      - { name: console.command }

  os2forms_fordelingskomponent.send.journalnotat:
    class: Drupal\os2forms_fordelingskomponent\Drush\Commands\SendJournalnotatCommand
    arguments: *abstract_command_arguments
    tags:
      - { name: console.command }

  os2forms_fordelingskomponent.send.validate_xml:
    class: Drupal\os2forms_fordelingskomponent\Drush\Commands\ValidateXmlCommand
    arguments:
      - '@Drupal\os2forms_fordelingskomponent\Helper\FordelingskomponentHelper'
      - '@Drupal\os2forms_fordelingskomponent\Settings'
      - '@entity_type.manager'
      - '@Drupal\os2forms_fordelingskomponent\Helper\WebformHelperSF2900'
    tags:
      - { name: console.command }
