id: os2forms_fdk_kp_sp246
title: os2forms_fdk_kp_sp246
description: ""
categories: {}
elements: |-
  aarsag:
    '#type': select
    '#title': Årsag
    '#options':
      HarBriller: HarBriller
      AndenBegrundelse: AndenBegrundelse
      SpecielleForhold: SpecielleForhold
    '#required': true
  aarsag_harbriller_alder:
    '#type': number
    '#title': 'Brillens/kontaktlinsernes alder'
    '#required': true
    '#states':
      visible:
        ':input[name="aarsag"]':
          value: HarBriller
    '#min': 0
    '#max': 100
  aarsag_andenbegrundelse:
    '#type': textfield
    '#title': 'Anden/yderligere/mere specifik begrundelse'
    '#maxlength': 200
    '#required': true
    '#states':
      visible:
        ':input[name="aarsag"]':
          value: AndenBegrundelse
  aarsag_specielleforhold:
    '#type': textfield
    '#title': 'Specielle forhold, fx allergi, der goer sig gaeldende for valg af stel/glas (husk laegeerklaering)'
    '#maxlength': 200
    '#required': true
    '#states':
      visible:
        ':input[name="aarsag"]':
          value: SpecielleForhold
  overslag_brilleglas:
    '#type': checkbox
    '#title': Overslag_Brilleglas
  overslag_brilleglas_venstre_styrke:
    '#type': textfield
    '#title': Overslag_Brilleglas_Venstre_Styrke
    '#input_mask': "'alias': 'numeric', 'radixPoint': ',', 'digits': 1, 'digitsOptional': false"
    '#required': true
    '#states':
      visible:
        ':input[name="overslag_brilleglas"]':
          checked: true
  overslag_brilleglas_hoejre_styrke:
    '#type': textfield
    '#title': Overslag_Brilleglas_Hoejre_Styrke
    '#input_mask': "'alias': 'numeric', 'radixPoint': ',', 'digits': 1, 'digitsOptional': false"
    '#required': true
    '#states':
      visible:
        ':input[name="overslag_brilleglas"]':
          checked: true
  overslag_brilleglas_pris:
    '#type': textfield
    '#title': Overslag_Brilleglas_Pris
    '#input_mask': "'alias': 'numeric', 'radixPoint': ',', 'digits': 2, 'digitsOptional': false, 'allowMinus': false"
    '#required': true
    '#states':
      visible:
        ':input[name="overslag_brilleglas"]':
          checked: true
  overslag_brillestel:
    '#type': checkbox
    '#title': Overslag_Brillestel
  overslag_brillestel_navn:
    '#type': textfield
    '#title': Overslag_Brillestel_Navn
    '#required': true
    '#states':
      visible:
        ':input[name="overslag_brillestel"]':
          checked: true
  overslag_brillestel_pris:
    '#type': textfield
    '#title': Overslag_Brillestel_Pris
    '#input_mask': "'alias': 'numeric', 'radixPoint': ',', 'digits': 2, 'digitsOptional': false, 'allowMinus': false"
    '#required': true
    '#states':
      visible:
        ':input[name="overslag_brillestel"]':
          checked: true
  overslag_pris:
    '#title': 'I alt'
    '#type': webform_computed_twig
    '#template': |
      {# number_format (https://twig.symfony.com/doc/3.x/filters/number_format.html) will cast anything to a float before formatting
      (cf. https://github.com/twigphp/Twig/blob/99d95dd6b8b0cc3c2397d15d45a4bb87eff89ddc/src/Extension/CoreExtension.php#L698) #}
      {# Strip thousand and decimal separators (from Danish floats); compute with 4 decimals #}
      {% set values = [
         data.overslag_brilleglas_pris|replace({'.': ''})|replace({',': '.'})|number_format(4),
         data.overslag_brillestel_pris|replace({'.': ''})|replace({',': '.'})|number_format(4),
      ] %}
      {% set sum = values|reduce((carry, value) => carry + value) %}
      {{ sum|number_format(2, ',', '') }}
    '#store': true
    '#ajax': true
