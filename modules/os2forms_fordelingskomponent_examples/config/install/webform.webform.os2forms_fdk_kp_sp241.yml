  markup:
    '#type': webform_markup
    '#markup': '<p><a href="/webform/[webform:id]/test?ansoeger_personnummer=1234567890&amp;ansoeger_telefonnummer=12345678&amp;fuldmagt_fuldmagthaverspersonnummer=0987654321">Udfyld med testdata</a></p>'
  ansoeger_fornavn:
    '#type': textfield
    '#title': Fornavn
    '#required': true
    '#prepopulate': true
  ansoeger_mellemnavn:
    '#type': textfield
    '#title': Mellemnavn
    '#prepopulate': true
  ansoeger_efternavn:
    '#type': textfield
    '#title': Efternavn
    '#required': true
    '#prepopulate': true
  ansoeger_personnummer:
    '#type': textfield
    '#title': Personnummer
    '#required': true
    '#pattern': '\d{10}'
    '#prepopulate': true
  ansoeger_telefonnummer:
    '#type': textfield
    '#title': Telefonnummer
    '#pattern': \d+
    '#prepopulate': true
  sygeforsikring:
    '#type': checkbox
    '#title': Sygeforsikring
    '#prepopulate': true
  sygeforsikring_gruppe:
    '#type': select
    '#title': Gruppe
    '#options':
      GRUPPE_1: 'Gruppe 1'
      GRUPPE_2: 'Gruppe 2'
      GRUPPE_5: 'Gruppe 5'
      GRUPPE_E: 'Gruppe E'
      GRUPPE_N: 'Gruppe N'
      GRUPPE_S: 'Gruppe S'
      GRUPPE_BASIS: Basis
    '#prepopulate': true
    '#states':
      visible:
        ':input[name="sygeforsikring"]':
          checked: true
      required:
        ':input[name="sygeforsikring"]':
          checked: true
  erklaering:
    '#type': checkbox
    '#title': Erklæring
    '#required': true
    '#prepopulate': true
  underskriftsoplysninger_underskriftsdato:
    '#type': date
    '#title': Underskriftsdato
    '#disabled': true
    '#default_value': today
  fuldmagt:
    '#type': checkbox
    '#title': Fuldmagt
    '#prepopulate': true
  fuldmagt_fuldmagtdokumentnavn:
    '#type': textfield
    '#title': Navn
    '#prepopulate': true
    '#states':
      visible:
        ':input[name="fuldmagt"]':
          checked: true
      required:
        ':input[name="fuldmagt"]':
          checked: true
  fuldmagt_fuldmagthaverspersonnummer:
    '#type': textfield
    '#title': Personnummer
    '#pattern': '\d{10}'
    '#prepopulate': true
    '#states':
      visible:
        ':input[name="fuldmagt"]':
          checked: true
      required:
        ':input[name="fuldmagt"]':
          checked: true
  dokumenter_overslag:
    '#type': webform_document_file
    '#title': Overslag
  dokumenter_faktura:
    '#type': webform_document_file
    '#title': Faktura
  dokumenter_bilag:
    '#type': webform_document_file
    '#title': Bilag
