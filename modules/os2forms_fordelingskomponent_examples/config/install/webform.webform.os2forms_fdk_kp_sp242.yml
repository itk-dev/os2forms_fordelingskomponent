id: os2forms_fdk_kp_sp242
title: "SP242 (eksempel): Ansøgning om udvidet helbredstillæg"
description: ""
categories:
  - Eksempel
  - Fordelingskomponent
  - KP
  - SP
elements: |-
  markup:
    '#type': webform_markup
    '#markup': '<p>Bygget ud fra https://github.com/itk-dev/os2forms_fordelingskomponent/blob/os2forms_fordelingskomponent/resources/SP/SF2900_XSD/SP242.xsd</p><p><a href="/webform/[webform:id]/test?ansoeger_personnummer=1234567890&amp;ansoeger_telefonnummer=12345678&amp;fuldmagt_fuldmagthaverspersonnummer=0987654321">Udfyld med testdata</a></p>'
  ansoeger_fornavn:
    '#type': textfield
    '#title': Fornavn
    '#required': true
    '#prepopulate': true
  ansoeger_mellemnavn:
    '#type': textfield
    '#title': Mellemnavn
    '#prepopulate': true
  ansoeger_efternavn:
    '#type': textfield
    '#title': Efternavn
    '#required': true
    '#prepopulate': true
  ansoeger_personnummer:
    '#type': textfield
    '#title': Personnummer
    '#required': true
    '#pattern': '\d{10}'
    '#prepopulate': true
  ansoeger_telefonnummer:
    '#type': textfield
    '#title': Telefonnummer
    '#pattern': \d+
    '#prepopulate': true
  udvidethelbredstillaeg:
    '#type': select
    '#title': 'Udvidet helbredstillæg'
    '#required': true
    '#options':
      Tandprotese: Tandprotese
      Briller: Briller
      Fodbehandling: Fodbehandling
    '#prepopulate': true
  sygeforsikring_gruppe:
    '#type': select
    '#title': Gruppe
    '#options':
      GRUPPE_1: 'Gruppe 1'
      GRUPPE_2: 'Gruppe 2'
      GRUPPE_5: 'Gruppe 5'
      GRUPPE_E: 'Gruppe E'
      GRUPPE_N: 'Gruppe N'
      GRUPPE_S: 'Gruppe S'
      GRUPPE_BASIS: Basis
    '#prepopulate': true
  underskriftsoplysninger_underskrift:
    '#type': textfield
    '#title': Underskrift
    '#prepopulate': true
  underskriftsoplysninger_underskriftsdato:
    '#type': date
    '#title': Underskriftsdato
    '#disabled': true
    '#default_value': today
    '#prepopulate': true
  samtykke:
    '#type': checkbox
    '#title': Samtykke
    '#required': true
    '#prepopulate': true
  erklaering:
    '#type': checkbox
    '#title': Erklæring
    '#required': true
    '#prepopulate': true
  fuldmagt_fuldmagtdokumentnavn:
    '#type': textfield
    '#title': Navn
    '#prepopulate': true
  fuldmagt_fuldmagthaverspersonnummer:
    '#type': textfield
    '#pattern': '\d{10}'
    '#title': Personnummer
    '#prepopulate': true
  dokumenter_overslag:
    '#type': webform_document_file
    '#title': Overslag
  dokumenter_faktura:
    '#type': webform_document_file
    '#title': Faktura
  dokumenter_bilag:
    '#type': webform_document_file
    '#title': Bilag
  kvittering:
    '#type': os2forms_attachment
    '#title': kvittering
    '#export_type': pdf
    '#digital_signature': 0
    '#excluded_elements': {  }
    '#exclude_empty': 0
    '#exclude_empty_checkbox': 0
