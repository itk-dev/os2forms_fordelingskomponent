os2forms_fordelingskomponent.admin.settings:
  path: "/admin/os2forms_fordelingskomponent/settings"
  defaults:
    _title: "Fordelingskomponent settings"
    _form: 'Drupal\os2forms_fordelingskomponent\Form\SettingsForm'
  requirements:
    _permission: "administer site configuration"

os2forms_fordelingskomponent.routing_info:
  path: "/os2forms-fordelingskomponent/routing/{webform}/{handler}"
  defaults:
    _title: "Fordelingskomponent routing info"
    _controller: '\Drupal\os2forms_fordelingskomponent\Controller\Os2formsFordelingskomponentRoutingInfoController'
  options:
    parameters:
      webform:
        type: "entity:webform"
  requirements:
    _permission: "administer site configuration"

os2forms_fordelingskomponent.fordelingskomponent_payload.preview:
  path: "/admin/structure/webform/manage/{webform}/os2forms_fordelingskomponent/payload/{webform_handler}/preview"
  defaults:
    _controller: '\Drupal\os2forms_fordelingskomponent\Controller\Os2formsFordelingskomponentPayloadPreviewController'
    _title: "Fordelingskomponent payload preview"
  options:
    parameters:
      webform:
        type: "entity:webform"
  requirements:
    _permission: "view any webform submission"

os2forms_fordelingskomponent.fordelingskomponent_payload.preview_render:
  path: "/admin/structure/webform/manage/{webform}/os2forms_fordelingskomponent/payload/{webform_handler}/preview/render/{submission}"
  defaults:
    _controller: '\Drupal\os2forms_fordelingskomponent\Controller\Os2formsFordelingskomponentPayloadPreviewRenderController'
    _title: "Fordelingskomponent payload preview"
  options:
    parameters:
      webform:
        type: "entity:webform"
      submission:
        type: "entity:webform_submission"
  requirements:
    _permission: "view any webform submission"
